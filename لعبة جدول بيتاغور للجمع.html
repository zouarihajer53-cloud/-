<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جدول بيتاغور للجمع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            padding: 10px;
            color: #2d3436;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: calc(100vh - 20px);
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .title {
            color: #2d3436;
            font-size: 1.8em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .level-info {
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .question-section {
            background: linear-gradient(45deg, #fd79a8, #fdcb6e);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        .question {
            font-size: 2.2em;
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .answer-input {
            font-size: 2.5em;
            padding: 15px 25px;
            border: 4px solid white;
            border-radius: 15px;
            text-align: center;
            width: 120px;
            outline: none;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            border-color: #00b894;
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.3);
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.3em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: white;
        }

        .check-btn {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .next-btn {
            background: linear-gradient(45deg, #a29bfe, #6c5ce7);
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .feedback {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .progress {
            width: 100%;
            max-width: 600px;
            background: #ddd;
            border-radius: 15px;
            height: 15px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            background: linear-gradient(45deg, #00b894, #00cec9);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .pythagorean-table {
            margin-top: 15px;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1.1em;
        }

        .pythagorean-table th,
        .pythagorean-table td {
            width: 50px;
            height: 50px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            border: 2px solid #ddd;
        }

        .pythagorean-table th {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            color: white;
        }

        .pythagorean-table .row-header {
            background: linear-gradient(45deg, #fd79a8, #e84393);
            color: white;
        }

        .pythagorean-table .revealed {
            background: #d4edda;
            color: #155724;
            animation: reveal 0.5s ease;
        }

        .pythagorean-table .current {
            background: #fff3cd;
            border-color: #ffc107;
            animation: pulse 1s infinite;
        }

        @keyframes reveal {
            from { background: #fff3cd; }
            to { background: #d4edda; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .completion-message {
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stars {
            font-size: 2em;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                height: calc(100vh - 10px);
            }
            
            .title {
                font-size: 1.5em;
            }
            
            .question {
                font-size: 1.8em;
            }
            
            .answer-input {
                font-size: 1.6em;
                width: 80px;
                padding: 8px 15px;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 1em;
            }
            
            .pythagorean-table th,
            .pythagorean-table td {
                width: 35px;
                height: 35px;
                font-size: 1em;
            }
            
            .level-info {
                font-size: 0.9em;
                padding: 6px 15px;
            }
            
            .question-section {
                padding: 15px;
            }
        }

        @media (min-width: 769px) {
            .container {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            
            .pythagorean-table th,
            .pythagorean-table td {
                width: 55px;
                height: 55px;
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🎯 لعبة جدول بيتاغور للجمع 🎯</h1>
            <div class="level-info">
                المستوى: <span id="currentLevel">1</span> من <span id="totalLevels">10</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="game-area">
            <div class="question-section">
                <div class="question" id="question">8 + 9 = ؟</div>
                <div class="input-area">
                    <input type="number" class="answer-input" id="answerInput" placeholder="؟">
                    <button class="btn check-btn" id="checkBtn" onclick="checkAnswer()">تحقق من الإجابة</button>
                    <button class="btn next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي</button>
                </div>
                <div class="feedback" id="feedback"></div>
            </div>

            <div class="completion-message" id="completionMessage">
                <div class="stars">⭐ ⭐ ⭐</div>
                <div>مبروك! لقد أكملت جدول بيتاغور للجمع!</div>
                <div class="stars">🎉 🎊 🎉</div>
            </div>

            <table class="pythagorean-table" id="pythagoreanTable">
                <tr>
                    <th>+</th>
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // بيانات اللعبة
        let currentLevel = 1;
        let totalLevels = 10;
        let questionsPerLevel = 10;
        let currentQuestionInLevel = 0;
        let totalQuestionsAnswered = 0;
        let totalQuestions = 100; // 10x10 جدول
        
        // إنشاء قائمة بجميع أسئلة الجدول
        let allQuestions = [];
        for (let i = 1; i <= 10; i++) {
            for (let j = 1; j <= 10; j++) {
                allQuestions.push({num1: i, num2: j, answer: i + j, revealed: false});
            }
        }

        // خلط الأسئلة بشكل عشوائي
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleArray(allQuestions);
        let currentQuestionIndex = 0;
        let currentQuestion = allQuestions[0];

        // إنشاء جدول بيتاغور
        function createPythagoreanTable() {
            const table = document.getElementById('pythagoreanTable');
            
            for (let i = 1; i <= 10; i++) {
                const row = table.insertRow();
                const rowHeader = row.insertCell(0);
                rowHeader.textContent = i;
                rowHeader.className = 'row-header';
                
                for (let j = 1; j <= 10; j++) {
                    const cell = row.insertCell();
                    cell.id = `cell-${i}-${j}`;
                    cell.textContent = ''; // إخفاء النتائج في البداية
                    cell.style.background = '#f8f9fa';
                }
            }
        }

        // عرض السؤال الحالي
        function displayQuestion() {
            const questionElement = document.getElementById('question');
            questionElement.textContent = `${currentQuestion.num1} + ${currentQuestion.num2} = ؟`;
            
            // تمييز الخلية الحالية في الجدول
            clearCurrentHighlight();
            const currentCell = document.getElementById(`cell-${currentQuestion.num1}-${currentQuestion.num2}`);
            if (currentCell) {
                currentCell.classList.add('current');
            }
            
            // تنظيف الإدخال والتعليقات
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // إزالة تمييز الخلية الحالية
        function clearCurrentHighlight() {
            const currentCells = document.querySelectorAll('.current');
            currentCells.forEach(cell => cell.classList.remove('current'));
        }

        // فحص الإجابة
        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answerInput').value);
            const feedback = document.getElementById('feedback');
            const correctAnswer = currentQuestion.answer;
            
            if (isNaN(userAnswer)) {
                alert('يرجى إدخال رقم صحيح');
                return;
            }
            
            feedback.style.display = 'block';
            
            if (userAnswer === correctAnswer) {
                feedback.textContent = `✅ إجابة صحيحة! ${currentQuestion.num1} + ${currentQuestion.num2} = ${correctAnswer}`;
                feedback.className = 'feedback correct';
                
                // إظهار النتيجة في الجدول
                const cell = document.getElementById(`cell-${currentQuestion.num1}-${currentQuestion.num2}`);
                if (cell) {
                    cell.textContent = correctAnswer;
                    cell.classList.remove('current');
                    cell.classList.add('revealed');
                }
                
                currentQuestion.revealed = true;
                totalQuestionsAnswered++;
                currentQuestionInLevel++;
                
                // تحديث شريط التقدم
                updateProgress();
                
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
                
            } else {
                feedback.textContent = `❌ إجابة خاطئة. حاول مرة أخرى!`;
                feedback.className = 'feedback incorrect';
            }
        }

        // الانتقال للسؤال التالي
        function nextQuestion() {
            if (totalQuestionsAnswered >= totalQuestions) {
                showCompletionMessage();
                return;
            }
            
            // التحقق من انتهاء المستوى الحالي
            if (currentQuestionInLevel >= questionsPerLevel) {
                currentLevel++;
                currentQuestionInLevel = 0;
                document.getElementById('currentLevel').textContent = currentLevel;
            }
            
            currentQuestionIndex++;
            currentQuestion = allQuestions[currentQuestionIndex];
            displayQuestion();
        }

        // تحديث شريط التقدم
        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressPercentage = (totalQuestionsAnswered / totalQuestions) * 100;
            progressBar.style.width = progressPercentage + '%';
        }

        // إظهار رسالة الإكمال
        function showCompletionMessage() {
            document.querySelector('.question-section').style.display = 'none';
            document.getElementById('completionMessage').style.display = 'block';
            clearCurrentHighlight();
        }

        // إضافة مستمع الأحداث للإدخال
        document.getElementById('answerInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                if (document.getElementById('checkBtn').style.display !== 'none') {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        });

        // تهيئة اللعبة
        function initGame() {
            createPythagoreanTable();
            displayQuestion();
            document.getElementById('totalLevels').textContent = totalLevels;
            document.getElementById('answerInput').focus();
        }

        // بدء اللعبة عند تحميل الصفحة
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
